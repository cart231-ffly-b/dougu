<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小さな道具</title>
<style>
  body { font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; line-height: 1.7; color: #222; background: #fafaf7; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; color: #555; }
  a.tool { display: block; padding: 16px; margin: 0 0 12px; background: #fff; border: 1px solid #ddd; border-radius: 10px; color: inherit; text-decoration: none; }
  a.tool:hover { border-color: #888; }
  a.tool strong { display: block; font-size: 1.1rem; }
  a.tool span { color: #555; font-size: .95rem; }
  footer { margin-top: 32px; font-size: .85rem; color: #777; }
</style>
</head>
<body>
<h1>小さな道具</h1>
<p class="lead">気になった話題を、公式の資料で確かめて、すぐ使える形にしたものです。入れた数字はどこにも送りません（ブラウザの中だけで計算します）。</p>

<a class="tool" href="kabe-check/">
  <strong>年収の壁チェッカー（2026年）</strong>
  <span>パート・アルバイトの給与で、越えると何が変わるかを一度に出します。</span>
</a>

<a class="tool" href="nencho/">
  <strong>年末調整の家族チェッカー（令和8年分）</strong>
  <span>家族ごとに、受けられる控除と、申告書のどの欄に書くかを出します。</span>
</a>

<footer>作った人: 上条碧斗。計算は目安です。最終的な判断は、勤め先や税務署・年金事務所に確かめてください。</footer>
</body>
</html>
